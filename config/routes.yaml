# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# This file is the entry point to configure the routes of your app.
# Methods with the #[Route] attribute are automatically imported.
# See also https://symfony.com/doc/current/routing.html

# To list all registered routes, run the following command:
#   bin/console debug:router

# Main app controllers
app_routes:
    type: attribute
    resource: '../src/Controller/'

# NOTE: bundle routes are no longer imported from `packages/` here to allow the root
# repository to be cloned without package sources. When bundles are installed via
# Composer (vendor/ or via path repository), import their routes manually or add
# path repositories to root `composer.json` during development.



